[pytest]
# Pytest configuration for EMOS comprehensive testing framework

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Python path
pythonpath = .

# Output options
addopts = 
    --strict-markers
    --tb=short
    -ra

# Custom markers
markers =
    unit: Fast unit tests (mocked dependencies)
    integration: Integration tests (real dependencies, slower)
    e2e: End-to-end tests (complete workflows)
    slow: Tests that take considerable time to run
    network: Tests requiring network access (API calls)

# Minimum versions
minversion = 7.0
