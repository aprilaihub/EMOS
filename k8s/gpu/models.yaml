apiVersion: apps/v1
kind: Deployment
metadata:
  name: emos-mattergen
  namespace: eidf204ns
  labels:
    app: emos-mattergen
    emos.ai/gpu-model: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emos-mattergen
  template:
    metadata:
      labels:
        app: emos-mattergen
        emos.ai/gpu-model: "true"
        kueue.x-k8s.io/queue-name: eidf204ns-user-queue
    spec:
      containers:
        - name: mattergen
          image: atishdixit16/emos-mattergen:gpu
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MATTERGEN_DEVICE
              value: cuda
            - name: CUDA_DEVICE_ORDER
              value: PCI_BUS_ID
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "2"
              memory: 8Gi
            limits:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 16Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 60
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: emos-mattergen
  namespace: eidf204ns
spec:
  selector:
    app: emos-mattergen
  ports:
    - port: 8000
      targetPort: 8000
---
