###############################################################################
# EMOS Docker Compose
# ---------------------------------------------------------------------------
# Defines containerised services that the EMOS platform talks to over HTTP.
# Each heavy/GPU-dependent model lives in its own container.
#
# Usage:
#   docker compose up -d                  # CPU-only (no GPU)
#   docker compose up -d --build          # rebuild images first
#   docker compose --profile gpu up -d    # with NVIDIA GPU passthrough
#
# The main EMOS backend (Flask on :5001) runs on the host and reaches
# these services via http://localhost:<port>.
###############################################################################

services:
  # -----------------------------------------------------------------------
  # MatterGen — crystal-structure generator (Microsoft Research)
  # -----------------------------------------------------------------------
  mattergen:
    build:
      context: ./Information_Units/Generators/MattergenBaseModel/docker
      dockerfile: Dockerfile
    container_name: emos-mattergen
    ports:
      - "${MATTERGEN_PORT:-8100}:8000"
    volumes:
      # Cache HuggingFace models so they survive container restarts
      - ./data/mattergen/hf_cache:/root/.cache/huggingface
    environment:
      # Set to "cpu" to force CPU inference (useful for testing)
      - MATTERGEN_DEVICE=${MATTERGEN_DEVICE:-auto}
    restart: unless-stopped

    # Uncomment the block below (or use --profile gpu) for GPU passthrough
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # -----------------------------------------------------------------------
  # GPU profile variant — same service but with GPU reservation
  # Activate with:  docker compose --profile gpu up -d
  # -----------------------------------------------------------------------
  mattergen-gpu:
    extends:
      service: mattergen
    container_name: emos-mattergen-gpu
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # -----------------------------------------------------------------------
  # GBFS — material-property predictor (LightGBM + matminer)
  # -----------------------------------------------------------------------
  # Exposes a FastAPI server for predicting material properties from CIF data.
  #   POST /predict/{property}   – predict a single property
  #   POST /batch-predict        – predict multiple properties at once
  #   GET  /info                 – list supported properties
  #   GET  /health               – health check
  #   GET  /docs                 – interactive API docs (Swagger)
  # -----------------------------------------------------------------------
  gbfs-pred:
    build:
      context: .
      dockerfile: Information_Units/Predictors/GBFS_Pred/docker/Dockerfile
    image: gbfs-pred:latest
    container_name: emos-gbfs-pred
    ports:
      - "${GBFS_PORT:-8200}:8000"
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      GBFS_HOST: 0.0.0.0
      GBFS_PORT: 8000
      GBFS_LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
