name: Deploy EMOS Website to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site for deployment
        run: |
          # Create deployment directory
          mkdir -p _site
          
          # Copy the flat frontend source into the deployment root so public URLs stay unchanged
          cp -r frontend/. _site/

          # Copy devtools data used by the Node Editor
          mkdir -p _site/devtools
          cp devtools/source_data.json devtools/metadata.json _site/devtools/
          
          # Copy Features and Information_Units directories (CRITICAL for functionality)
          cp -r Features/ _site/
          cp -r Information_Units/ _site/
          
          # Copy backend files (for reference, though not used on GitHub Pages)
          cp -r backend/ _site/
          
          # Copy Markdown documentation used by documentation.html
          cp -r docs/ _site/docs/
          
          # Copy additional files that might be needed
          cp test-backend.html _site/ 2>/dev/null || true
          cp Procfile requirements.txt _site/ 2>/dev/null || true
          
          # List contents to verify
          echo "Site contents:"
          test -f _site/index.html
          find _site -type f -name "*.js" | head -20
          echo "Feature files:"
          find _site/Features -name "*.js" 2>/dev/null | head -10 || echo "No Features directory found"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4