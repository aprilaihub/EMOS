# Docker Compose configuration for AMD FastAPI Service
#
# The AMD service compares crystal structures using Average Minimum Distance.
# All data is passed as JSON dictionaries (no auxiliary files created).
#
# Usage:
#   docker-compose build        # Build the image
#   docker-compose up           # Start the service (runs on localhost:8001)
#   curl -X GET http://localhost:8001/health  # Health check
#
# To test predictions, use the /predict or /compare-files endpoints
# See the API documentation at http://localhost:8001/docs

version: '3.8'

services:
  amd:
    build:
      context: ../../../../../../  # Build from EMOS root
      dockerfile: Information_Units/Predictors/AMD/docker/Dockerfile
    
    image: amd-predictor:latest
    container_name: amd-predictor
    
    # Expose the FastAPI server
    ports:
      - "8001:8001"
    
    # Volume mounts for CIF files (optional - data can also be provided via API)
    volumes:
      - ./cif_inputs:/app/cif_inputs:ro
      - ./cif_outputs:/app/cif_outputs
    
    # Environment variables
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      AMD_HOST: 0.0.0.0
      AMD_PORT: 8001
      AMD_LOG_LEVEL: INFO
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
