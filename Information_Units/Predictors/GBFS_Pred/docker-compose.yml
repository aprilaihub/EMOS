# Docker Compose configuration for GBFS Predictor
# 
# Usage:
#   docker-compose build        # Build the image
#   docker-compose run gbfs \   # Run prediction
#     --cif /data/sample.cif \
#     --model /data/bandgap_model.pkl \
#     --scaler /data/bandgap_scaler.pkl \
#     --features /data/bandgap_features.pkl

version: '3.8'

services:
  gbfs:
    build:
      context: ../../../../../../  # Build from EMOS root
      dockerfile: Information_Units/Predictors/GBFS_Pred/Dockerfile
    image: gbfs-pred:latest
    container_name: gbfs-predictor
    
    # Mount data directory for input/output
    volumes:
      - ./data:/data
      - ./models:/models
    
    # Environment variables
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
